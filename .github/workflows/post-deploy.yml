name: Post-deploy Verification
on:
  workflow_run:
    workflows: ["Deploy Staging"]
    types:
      - completed

jobs:
  verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Verify System Health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Prepare SA
        env:
          ROTATE_SA_KEY: ${{ secrets.ROTATE_SA_KEY }}
        run: |
          mkdir -p "${{ runner.temp }}/gcloud"
          echo "$ROTATE_SA_KEY" | base64 --decode > "${{ runner.temp }}/gcloud/rotate-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${{ runner.temp }}/gcloud/rotate-sa.json" >> $GITHUB_ENV

      - name: Run Verification Script
        env:
          SMOKE_DOC_ID: ${{ secrets.SMOKE_DOC_ID }}
          PROJECT_ID: 'ozen-staging-2025'
        run: |
          # כאן התיקון: הוספנו את --bucketName לפקודה
          node scripts/verify_document.js \
            --docId="${SMOKE_DOC_ID}" \
            --project="${PROJECT_ID}" \
            --bucketName="${PROJECT_ID}.appspot.com"
