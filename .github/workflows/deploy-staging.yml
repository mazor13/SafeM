name: Deploy Staging

on:
  push:
    branches: [ 'scaffold/sprint-0' ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # התקנת Node.js (נדרש בשביל לקמפל את הקוד לפני)
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    # התקנת הספריות של הפונקציות
    - name: Install Dependencies
      run: |
        cd functions
        npm install

    # זה התיקון הגדול: שימוש ב-Action מוכן במקום פקודות ידניות
    # ה-Action הזה מטפל באוטנטיקציה בצורה מושלמת
    - name: Deploy to Firebase
      uses: w9jds/firebase-action@master
      with:
        args: deploy --only functions,firestore
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        PROJECT_ID: handy-compass-477613-a4

