name: CI

on:
  push:
    branches: [ 'main', 'scaffold/sprint-0' ]
  pull_request:
    branches: [ 'main' ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install root dependencies
      run: npm install

    - name: Install functions dependencies
      run: |
        cd functions
        npm install

    - name: Lint
      run: |
        echo "(placeholder) run linters here"

    - name: Run tests
      run: |
        echo "(placeholder) run tests here"
