name: CI (Test & Lint)

on:
  push:
    branches: [ 'main', 'chore/tests-ci' ]
  pull_request:
    branches: [ 'main' ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm ci || npm install

      # --- התיקון: התקנה + בנייה (Build) ---
      - name: Install & Build Functions
        run: |
          cd functions
          npm ci || npm install
          npm run build
      # -------------------------------------

      - name: Run unit tests
        run: |
          cd functions
          npm run test:unit

      - name: Run emulator integration tests
        run: |
          cd functions
          npm install -g firebase-tools
          npm run test:emulator
